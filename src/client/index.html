    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96" />
    <link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:site_name" content="Gargamel bắt Xì Trum SGU" />

  <body>
    <div id="app">
      <main id="screen" aria-live="polite"></main>
      <section id="stage" hidden aria-label="Màn rượt đuổi">
        <div id="game"></div>
        <div class="stage-overlay">
          <button id="skip-btn" class="btn wood" title="Bỏ qua tới kết quả (phím S)">⏭ Bỏ qua <kbd>S</kbd></button>
        </div>
      </section>
    </div>
    <div class="toolbar">
      <button id="mute-btn" class="icon-btn round" title="Bật/tắt âm thanh (phím M)">🔊</button>
      <button id="fs-btn" class="icon-btn round" title="Toàn màn hình (phím F)">⛶</button>
